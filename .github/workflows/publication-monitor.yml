name: Publication Availability Monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-availability-monitor
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24.19.0 }
      - name: Smoke test canonical publication
        run: node scripts/smoke-deployment.mjs https://nexora-blueprint.vercel.app
        env:
          SMOKE_REPORT_PATH: publication-smoke-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publication-smoke-${{ github.run_id }}
          path: publication-smoke-report.json
          if-no-files-found: error
          retention-days: 14
